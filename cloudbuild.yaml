steps:
  # ======================================================
  # STEP 1: RUN TESTS
  # STEP 1: QUALITY GATES (LINT + TYPECHECK + TESTS)
  # ======================================================
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install uv
        uv sync --all-groups
        export SECRET_KEY="dummy_secret_for_testing_only"
        export DB_PASS="dummy_pass"
        # Outside /workspace: step 2 builds the image from that directory.
        export DATABASE_URL="sqlite:////tmp/test.db"
        export FHIR_BACKEND="noop"
        export LLM_BACKEND="noop"
        uv run ruff check
        uv run mypy app/core/rate_limit.py app/core/logging.py --ignore-missing-imports
        uv run pytest --cov=app tests/

  # ======================================================
  # STEP 2: BUILD THE DOCKER IMAGE
  # ======================================================
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/hwb-repo/hwb-backend:$COMMIT_SHA'
      - '.'

  # ======================================================
  # STEP 3: PUSH THE IMAGE TO THE REGISTRY (CLOUD)
  # ======================================================
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/hwb-repo/hwb-backend:$COMMIT_SHA'

  # ======================================================
  # STEP 4: DEPLOY TO CLOUD RUN
  # ======================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'hwb-backend-dev'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/hwb-repo/hwb-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      # Capacity (docs/infrastructure/database.md § 1.1). One instance stays
      # up so a login after a quiet period does not wait for a cold start
      # (the app gives up after 20 s). At most 3 instances, because each one
      # may open DB_POOL_SIZE + DB_MAX_OVERFLOW = 5 connections and the
      # db-f1-micro instance lets the application open 22.
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '3'
      # The service runs as its own account, which holds only what the backend
      # needs (docs/infrastructure/gcp-deploy.md § 4). Without this flag Cloud
      # Run uses the Compute Engine default account.
      - '--service-account'
      - 'hwb-backend@$PROJECT_ID.iam.gserviceaccount.com'
      # NFC_MASTER_KEY was only needed for the first import into the keyring
      # (done 2026-09-14); version 0 lives wrapped under NFC_KEK since then.
      # --update-secrets keeps what an earlier revision mounted, so it is
      # removed explicitly. Removing a variable that is not there is a no-op.
      - '--remove-secrets'
      - 'NFC_MASTER_KEY'
      - '--update-secrets'
      - 'DB_PASS=hwb-db-pass:latest,SECRET_KEY=hwb-secret-key:latest,NFC_KEK=nfc-kek:latest'
      # 1. Montar la conexión de la nueva instancia SQL
      - '--set-cloudsql-instances'
      - 'migrants-unicef:us-central1:hwb-db-cluster'
      # 2. Conectar Cloud Run a la red privada (VPC) para alcanzar la IP privada
      - '--network'
      - 'default'
      - '--subnet'
      - 'default'
      - '--vpc-egress'
      - 'private-ranges-only'
      # 3. Actualizar las variables de entorno para que config.py las lea.
      # The clinical notes go to a GA Gemini model in the FHIR Store's region
      # (docs/architecture/ai-integration.md); both are set here so the
      # deployment says where the notes are processed.
      # NFC_BOOTSTRAP_IMPORT is set by hand for a first start only
      # (docs/infrastructure/nfc-key-management.md § 4); a deploy clears it.
      # The HL7 v2 variables are left over from an integration the code no
      # longer has. Removing a variable that is not there is a no-op.
      - '--remove-env-vars'
      - 'NFC_BOOTSTRAP_IMPORT,GCP_HL7_STORE_ID,HL7_SENDING_APP,HL7_SENDING_FACILITY,HL7_RECEIVING_APP,HL7_RECEIVING_FACILITY,HL7_PROCESSING_ID,HL7_VERSION_ID'
      - '--update-env-vars'
      - 'INSTANCE_CONNECTION_NAME=migrants-unicef:us-central1:hwb-db-cluster,DB_USER=postgres,DB_NAME=hwb_db,GCP_PROJECT_ID=migrants-unicef,GCP_LOCATION=us-central1,GCP_DATASET_ID=hwb-dataset,GCP_FHIR_STORE_ID=hwb-fhir-store,ACCESS_TOKEN_EXPIRE_MINUTES=60,REFRESH_TOKEN_EXPIRE_MINUTES=10080,LLM_MODEL_NAME=gemini-3.8-flash,LLM_LOCATION=us-central1'

# Maximum build time (15 minutes)
timeout: '900s'

# Use Cloud Logging only to avoid unnecessary logs in Cloud Build
options:
  logging: CLOUD_LOGGING_ONLY