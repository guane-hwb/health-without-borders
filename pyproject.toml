[project]
name = "health-without-borders"
version = "0.1.0"
description = "Interoperable medical records platform for migrant children"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt==4.0.1",
    "cbor2>=6.0.1",
    "cryptography>=50.0.0",
    "fastapi>=0.128.0",
    "google-auth>=2.48.0",
    "google-genai>=1.66.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.12.5",
    "python-dotenv>=1.2.2",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.31",
    "redis>=5.0.0",
    "requests>=2.33.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.46",
    "starlette>=1.3.1",
    "uvicorn>=0.40.0",
    "alembic>=1.16",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
]
# Documentation tooling: not installed in the production image.
docs = [
    "mkdocs-material>=9.7.7",
    "pymdown-extensions>=11.0.1",
    "pygments>=2.20.0",
]

[tool.uv]
# Floors for transitive dependencies with published advisories
# (pip-audit, 2026-09-24). Raise them here rather than as direct dependencies.
constraint-dependencies = [
    "anyio>=4.14.2",
    "click>=8.3.3",
    "idna>=3.15",
    "pyasn1>=0.6.4",
    "urllib3>=2.7.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# S: security (bandit) and ASYNC: blocking calls in async code, on top of the
# style/pyflakes/import rules.
select = ["E", "F", "I", "S", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# "token_type" is the JWT/OAuth2 token kind ("access", "refresh", "bearer"),
# not a password; DUMMY_PASSWORD_HASH is the deliberate anti-enumeration decoy.
"app/api/deps.py" = ["S105"]
"app/api/v1/endpoints/login.py" = ["S105", "S106"]
"app/core/security.py" = ["S106"]
"app/schemas/token.py" = ["S105"]
# Local "python -m app.main" entry point only; production runs uvicorn via CMD.
"app/main.py" = ["S104"]
# The WHO OAuth token endpoint URL, not a secret.
"scripts/sync_terminology.py" = ["S105"]
# Tests assert and use throwaway credentials by design.
"tests/**" = ["S"]

[tool.coverage.report]
# Entry-point guards only run when a module is executed as a script.
exclude_also = [
    'if __name__ == "__main__":',
]
