services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: hwb_local
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8080"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/hwb_local
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the environment}
      FIRST_SUPERUSER_EMAIL: admin@hwb.org
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?FIRST_SUPERUSER_PASSWORD must be set in the environment}
      DEBUG: "true"
      BACKEND_CORS_ORIGINS: ""
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  init:
    build: .
    entrypoint: ["bash", "-c"]
    command:
      - |
        python scripts/create_tables.py &&
        python scripts/create_generic_user.py &&
        echo "Database initialized successfully"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/hwb_local
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the environment}
      FIRST_SUPERUSER_EMAIL: admin@hwb.org
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?FIRST_SUPERUSER_PASSWORD must be set in the environment}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - init

volumes:
  pgdata:
