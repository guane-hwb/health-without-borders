name: Publish Docs
on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # mkdocs lives in the "docs" dependency group, outside the production image.
        run: uv sync --group docs
      - name: Deploy MkDocs
        run: uv run mkdocs gh-deploy --force