name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint with ruff
        run: uv run ruff check app/ tests/

      - name: Type check
        run: uv run mypy app/core/rate_limit.py app/core/logging.py --ignore-missing-imports

      - name: Audit production dependencies
        # Fails on any known vulnerability in what ships in the image.
        run: |
          uv export --no-dev --no-hashes --format requirements-txt -o requirements-prod.txt
          uvx pip-audit -r requirements-prod.txt --no-deps --disable-pip

      - name: Migrations match the models
        env:
          SECRET_KEY: "dummy_secret_for_ci_only"
          DB_PASS: "dummy_pass"
          DATABASE_URL: "sqlite:///./migrations-check.db"
          FHIR_BACKEND: "noop"
          LLM_BACKEND: "noop"
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests
        env:
          SECRET_KEY: "dummy_secret_for_ci_only"
          DB_PASS: "dummy_pass"
          DATABASE_URL: "sqlite:///./test.db"
          FHIR_BACKEND: "noop"
          LLM_BACKEND: "noop"
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=100

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7
  integration:
    name: Integration (PostgreSQL 15)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hwb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run integration tests against PostgreSQL
        # Real app startup (migrations included), real sessions and tokens,
        # no dependency overrides. The database name must contain "test".
        env:
          SECRET_KEY: "integration_secret_for_ci_only_0123456789abcdef"
          DB_PASS: "postgres"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/hwb_test"
          FHIR_BACKEND: "noop"
          LLM_BACKEND: "noop"
        run: uv run pytest tests/integration -m pg --no-cov -v
